[project]
name = "nse-backtester"
version = "0.1.0"
description = "Backtesting engine for NSE equities: ingestion, corporate-action adjustment, strategy simulation, cost modeling, and performance metrics."
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "pandas>=2.2",
    "duckdb>=1.0",
    "pyarrow>=16.0",
    "typer>=0.12",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src"]
